<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenFlowKit — Launch Film (v1)</title>
  <style>
    :root {
      --paper: #f7f2e7;
      --ink: #1b1a17;
      --graphite: #5b564c;
      --orange: #e95420;
      --blue: #2f6df6;
      --emerald: #12a06a;
      --amber: #e08a00;
      --red: #e0432f;
      --violet: #7a5cf0;
      --hand: "Chalkboard SE", "Comic Sans MS", "Segoe Print", "Bradley Hand", cursive;
      --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      height: 100%
    }

    body {
      background: #121114;
      background-image:
        radial-gradient(1200px 700px at 50% -10%, rgba(233, 84, 32, .10), transparent 60%),
        radial-gradient(900px 500px at 90% 110%, rgba(47, 109, 246, .07), transparent 60%);
      color: #efe9dc;
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 18px 26px;
      gap: 12px;
    }

    header {
      width: min(1280px, 100%);
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap
    }

    header h1 {
      font-family: var(--hand);
      font-size: 20px;
      margin: 0;
      letter-spacing: .2px
    }

    header h1 b {
      color: var(--orange)
    }

    header .tag {
      font-size: 12px;
      color: #8d867a;
      font-family: var(--mono)
    }

    header .tag em {
      color: #b9b1a2;
      font-style: normal
    }

    #stagewrap {
      width: min(1280px, 100%)
    }

    #stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 12px;
      overflow: hidden;
      background: var(--paper);
      box-shadow: 0 26px 70px rgba(0, 0, 0, .55), 0 2px 0 rgba(255, 255, 255, .06) inset;
    }

    #cv {
      display: block;
      width: 100%;
      height: 100%
    }


    #overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(18, 17, 20, .42);
      backdrop-filter: blur(2px);
    }

    #overlay.show {
      display: flex
    }

    #bigplay {
      font-family: var(--hand);
      font-size: 22px;
      color: var(--ink);
      background: var(--paper);
      border: 2px solid var(--ink);
      padding: 16px 26px;
      cursor: pointer;
      border-radius: 255px 14px 225px 14px/14px 225px 14px 255px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
      transform: rotate(-1.2deg);
    }

    #bigplay:hover {
      background: #fff
    }

    /* ---- control bar ---- */
    #bar {
      width: min(1280px, 100%);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: var(--paper);
      color: var(--ink);
      padding: 10px 14px;
      border-radius: 255px 16px 225px 16px/16px 225px 16px 255px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .35);
    }

    .btn {
      font-family: var(--hand);
      font-size: 14px;
      color: var(--ink);
      background: transparent;
      border: 1.6px solid #2a2721;
      padding: 6px 12px;
      cursor: pointer;
      line-height: 1.1;
      border-radius: 180px 10px 160px 10px/10px 160px 10px 180px;
      transition: transform .12s, background .12s;
    }

    .btn:hover {
      background: #fffdf6;
      transform: translateY(-1px) rotate(-.6deg)
    }

    .btn:active {
      transform: translateY(1px)
    }

    .btn:focus-visible {
      outline: 2.5px dashed var(--orange);
      outline-offset: 2px
    }

    .btn.on {
      background: #ffe9df;
      border-color: var(--orange);
      color: #a3350f
    }

    .btn.play {
      font-size: 17px;
      min-width: 44px
    }

    #clock {
      font-family: var(--mono);
      font-size: 12.5px;
      color: #6d675c;
      min-width: 104px;
      text-align: center
    }

    #scrubwrap {
      flex: 1 1 320px;
      min-width: 220px;
      display: flex;
      align-items: center
    }

    #scrubtrack {
      position: relative;
      width: 100%;
      height: 26px;
      cursor: pointer;
      touch-action: none;
      display: flex;
      align-items: center;
    }

    #scrubtrack:focus-visible {
      outline: 2.5px dashed var(--orange);
      outline-offset: 3px;
      border-radius: 6px
    }

    #scruggroove {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 4px;
      transform: translateY(-50%);
      background-image: repeating-linear-gradient(90deg, #b9ae97 0 7px, transparent 7px 12px);
      border-radius: 3px;
    }

    #scrubfill {
      position: absolute;
      left: 0;
      top: 50%;
      height: 4px;
      transform: translateY(-50%);
      width: 0;
      background: var(--orange);
      border-radius: 3px;
    }

    #scrubknob {
      position: absolute;
      left: 0;
      top: 50%;
      width: 16px;
      height: 16px;
      margin-left: -8px;
      transform: translateY(-50%);
      background: var(--paper);
      border: 2.4px solid var(--ink);
      border-radius: 60% 40% 55% 45%/45% 55% 45% 60%;
      box-shadow: 0 2px 0 rgba(0, 0, 0, .25);
    }

    #scrubticks {
      position: absolute;
      inset: 0;
      pointer-events: none
    }

    #scrubticks i {
      position: absolute;
      top: 2px;
      width: 1.6px;
      height: 7px;
      background: #a99f8b
    }


    footer {
      width: min(1280px, 100%);
      font-family: var(--mono);
      font-size: 11px;
      color: #6f6a60;
      line-height: 1.7
    }

    footer kbd {
      font-family: var(--mono);
      font-size: 10.5px;
      color: #bdb5a5;
      border: 1px solid #45413a;
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 1px 5px;
      background: #1b1a18;
    }

    @media (max-width:640px) {
      body {
        padding: 10px 10px 20px
      }

      header h1 {
        font-size: 17px
      }

      #clock {
        min-width: 88px;
        font-size: 11.5px
      }

      .btn {
        font-size: 12.5px;
        padding: 5px 9px
      }
    }
  </style>
</head>

<body>
  <header>
    <h1><b>OpenFlowKit</b> — launch film <span style="color:#6f6a60">v1</span></h1>
    <div class="tag">100% procedural · no images · no video · no fonts · every frame drawn in JS · <em>paper &amp;
        ink</em></div>
  </header>

  <div id="stagewrap">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="toast"></div>
      <div id="overlay"><button id="bigplay">▶ play the film</button></div>
    </div>
  </div>

  <div id="bar">
    <button class="btn play" id="play" title="Play / pause (space)">❚❚</button>
    <button class="btn" id="replay" title="Replay from the top (R)">↺</button>
    <span id="clock">0:00 / 0:00</span>
    <div id="scrubwrap">
      <div id="scrubtrack" tabindex="0" role="slider" aria-label="Timeline" aria-valuemin="0" aria-valuemax="100"
        aria-valuenow="0">
        <div id="scruggroove"></div>
        <div id="scrubfill"></div>
        <div id="scrubticks"></div>
        <div id="scrubknob"></div>
      </div>
    </div>
    <select class="btn" id="speed" title="Speed">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="1.5">1.5×</option>
      <option value="2">2×</option>
    </select>
    <button class="btn on" id="loop" title="Loop">loop</button>
    <button class="btn" id="sound" title="Procedural pencil sound (M)">sound: off</button>
    <button class="btn" id="png" title="Save this frame as a 1920×1080 PNG">⬇ png</button>
    <button class="btn" id="rec" title="Record the whole film to a video file">⬇ video</button>
    <button class="btn" id="fs" title="Fullscreen (F)">⛶</button>
  </div>

  <footer>
    <kbd>space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> ±5s · <kbd>1</kbd>–<kbd>9</kbd> jump to beat ·
    <kbd>R</kbd> replay · <kbd>F</kbd> fullscreen · <kbd>M</kbd> sound · <kbd>V</kbd> save a video · <kbd>P</kbd> save a
    frame
  </footer>

  <script>
    (function () {
      'use strict';

      /* ============================================================
         OpenFlowKit launch film — everything below is drawn by hand,
         in JavaScript, on a 2D canvas. No media, no external assets.
         Design space is 1600 x 900; the canvas scales to fit.
         ============================================================ */

      const DW = 1600, DH = 900;

      // palette ------------------------------------------------------
      const INK = '#1b1a17', GRAPHITE = '#5b564c', FAINT = '#8a8377', PAPER = '#f7f2e7';
      const ORANGE = '#e95420', BLUE = '#2f6df6', EMERALD = '#12a06a', AMBER = '#e08a00',
        RED = '#e0432f', VIOLET = '#7a5cf0';
      const HAND = '"Chalkboard SE","Comic Sans MS","Segoe Print","Bradley Hand",cursive';
      const MONO = '"SF Mono",ui-monospace,Menlo,Consolas,monospace';

      // ---------------------------------------------------------------- utils
      const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
      const lerp = (a, b, u) => a + (b - a) * u;
      const smooth = u => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
      const easeOut = u => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
      const easeIn = u => Math.pow(clamp(u, 0, 1), 3);
      const easeInOut = u => { u = clamp(u, 0, 1); return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
      const backOut = u => { u = clamp(u, 0, 1); const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
      const easeOutBack = backOut;
      const bounceOut = u => {
        u = clamp(u, 0, 1); const n = 7.5625, d = 2.75;
        if (u < 1 / d) return n * u * u; if (u < 2 / d) { u -= 1.5 / d; return n * u * u + .75; }
        if (u < 2.5 / d) { u -= 2.25 / d; return n * u * u + .9375; } u -= 2.625 / d; return n * u * u + .984375;
      };
      // staged reveal helper: 0 before a, 1 after b
      const p = (u, a, b) => clamp((u - a) / (b - a || 1e-6), 0, 1);
      const rnd = (a, b) => a + Math.random() * (b - a);

      // deterministic PRNG so the "hand jitter" is identical every frame
      function rngFor(seed) {
        let h = 2166136261 >>> 0;
        const s = String(seed);
        for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
        let a = h >>> 0;
        return function () {
          a |= 0; a = a + 0x6D2B79F5 | 0;
          let t = Math.imul(a ^ a >>> 15, 1 | a);
          t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }
      // global "boil": hand-drawn animation never sits still
      let boilSeed = 0, BOIL = 0, PEN = 1;
      const bseed = k => k + '~' + boilSeed;

      // ---------------------------------------------------------------- geometry → polylines
      function sampleLine(a, b, n) {
        const out = [];
        for (let i = 0; i <= n; i++) { const u = i / n; out.push([lerp(a[0], b[0], u), lerp(a[1], b[1], u)]); }
        return out;
      }
      function sampleCubic(p0, p1, p2, p3, n) {
        const out = [];
        for (let i = 0; i <= n; i++) {
          const u = i / n, v = 1 - u;
          out.push([
            v * v * v * p0[0] + 3 * v * v * u * p1[0] + 3 * v * u * u * p2[0] + u * u * u * p3[0],
            v * v * v * p0[1] + 3 * v * v * u * p1[1] + 3 * v * u * u * p2[1] + u * u * u * p3[1]
          ]);
        }
        return out;
      }
      function sampleQuad(p0, p1, p2, n) {
        const out = [];
        for (let i = 0; i <= n; i++) {
          const u = i / n, v = 1 - u;
          out.push([v * v * p0[0] + 2 * v * u * p1[0] + u * u * p2[0], v * v * p0[1] + 2 * v * u * p1[1] + u * u * p2[1]]);
        }
        return out;
      }
      function sampleEllipse(cx, cy, rx, ry, n, rot) {
        const out = []; rot = rot || 0;
        for (let i = 0; i < n; i++) {
          const a = i / n * Math.PI * 2;
          const x = Math.cos(a) * rx, y = Math.sin(a) * ry;
          out.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]);
        }
        return out;
      }
      function rectPts(x, y, w, h) { return [[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]]; }
      function roundRectPts(x, y, w, h, r) {
        r = Math.min(r, Math.min(w, h) / 2);
        const pts = [];
        const arc = (cx, cy, a0, a1) => {
          for (let i = 0; i <= 6; i++) { const a = lerp(a0, a1, i / 6); pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
        };
        pts.push([x + r, y]);
        pts.push([x + w - r, y]); arc(x + w - r, y + r, -Math.PI / 2, 0);
        pts.push([x + w, y + h - r]); arc(x + w - r, y + h - r, 0, Math.PI / 2);
        pts.push([x + r, y + h]); arc(x + r, y + h - r, Math.PI / 2, Math.PI);
        pts.push([x, y + r]); arc(x + r, y + r, Math.PI, Math.PI * 1.5);
        pts.push([x + r, y]);
        return pts;
      }
      function cylPts(x, y, w, h) {
        const rx = w / 2, ry = Math.min(h * 0.24, w * 0.24);
        const pts = [];
        const arc = (cy, a0, a1) => { for (let i = 0; i <= 14; i++) { const a = lerp(a0, a1, i / 14); pts.push([x + rx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } };
        arc(y + ry, 0, Math.PI * 2);
        pts.push([x + w, y + h - ry]);
        arc(y + h - ry, 0, Math.PI);
        pts.push([x, y + ry]);
        return pts;
      }
      function pathLen(pts) {
        let L = 0; for (let i = 1; i < pts.length; i++)L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
        return L;
      }
      // add hand wobble to a polyline; keeps shared vertices roughly put
      function wobblePath(pts, amp, rndn, taper) {
        if (pts.length < 2) return pts.slice();
        const out = [];
        for (let i = 0; i < pts.length - 1; i++) {
          const a = pts[i], b = pts[i + 1];
          const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
          const n = Math.max(2, Math.round(len / 16));
          const nx = -(b[1] - a[1]) / (len || 1), ny = (b[0] - a[0]) / (len || 1);
          const ox = (b[0] - a[0]) / (len || 1), oy = (b[1] - a[1]) / (len || 1);
          for (let k = 0; k < n; k++) {
            const u = k / n;
            const t = taper === false ? 1 : Math.pow(Math.sin(Math.PI * clamp(u, 0, 1)), .55);
            const off = (rndn() * 2 - 1) * amp * t;
            const slide = (rndn() * 2 - 1) * amp * 0.35 * t;
            out.push([lerp(a[0], b[0], u) + nx * off + ox * slide, lerp(a[1], b[1], u) + ny * off + oy * slide]);
          }
        }
        out.push(pts[pts.length - 1].slice());
        return out;
      }
      // walk a polyline, drawing only the first `reveal` fraction
      function partialPath(g, pts, reveal, head) {
        if (reveal <= 0 || pts.length < 2) return;
        const L = pathLen(pts), target = L * clamp(reveal, 0, 1);
        let acc = 0; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
        let hx = pts[0][0], hy = pts[0][1];
        for (let i = 1; i < pts.length; i++) {
          const seg = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
          if (acc + seg >= target) {
            const u = (target - acc) / (seg || 1);
            hx = lerp(pts[i - 1][0], pts[i][0], u); hy = lerp(pts[i - 1][1], pts[i][1], u);
            g.lineTo(hx, hy); acc = target; break;
          }
          g.lineTo(pts[i][0], pts[i][1]); acc += seg; hx = pts[i][0]; hy = pts[i][1];
        }
        g.stroke();
        if (head && reveal < 1) { g.beginPath(); g.arc(hx, hy, head, 0, Math.PI * 2); g.fill(); }
      }
      function dashify(pts, on, off) {
        if (!on) return [pts];
        const out = []; let cur = [pts[0]], acc = 0, dashOn = true;
        for (let i = 1; i < pts.length; i++) {
          let a = pts[i - 1], b = pts[i];
          let seg = Math.hypot(b[0] - a[0], b[1] - a[1]);
          while (seg > 0) {
            const room = (dashOn ? on : off) - acc;
            if (seg <= room) { acc += seg; if (dashOn) cur.push(b); a = b; seg = 0; }
            else {
              const u = room / (seg || 1);
              const mid = [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];
              if (dashOn) { cur.push(mid); out.push(cur); cur = [mid]; }
              else { cur = [mid]; }
              acc = 0; dashOn = !dashOn;
              a = mid; seg = Math.hypot(b[0] - a[0], b[1] - a[1]);
            }
          }
        }
        if (cur.length > 1) out.push(cur);
        return out;
      }
      // ---------------------------------------------------------------- the pen
      function stroke(g, pts, o) {
        o = o || {};
        if (!pts || pts.length < 2) return;
        const reveal = o.reveal === undefined ? 1 : clamp(o.reveal, 0, 1);
        if (reveal <= 0) return;
        const passes = o.passes === undefined ? 2 : o.passes;
        const base = o.seed === undefined ? 's' : o.seed;
        for (let k = 0; k < passes; k++) {
          const rndn = rngFor(base + '|p' + k);
          let wob = wobblePath(pts, (o.jitter === undefined ? 2.1 : o.jitter) * (k ? 1.35 : 1), rndn, o.taper);
          if (o.overshoot) {
            const a = wob[0], b = wob[wob.length - 1];
            const L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
            const ox = (b[0] - a[0]) / L * o.overshoot, oy = (b[1] - a[1]) / L * o.overshoot;
            wob = [[a[0] - ox, a[1] - oy]].concat(wob, [[b[0] + ox, b[1] + oy]]);
          }
          const segs = dashify(wob, o.dash, o.gap);
          g.save();
          const inh = g.globalAlpha;
          g.lineCap = 'round'; g.lineJoin = 'round';
          g.strokeStyle = o.color || INK;
          g.globalAlpha = inh * (o.alpha === undefined ? 1 : o.alpha) * (k ? 0.42 : 0.96);
          g.lineWidth = (o.w === undefined ? 2.6 : o.w) * PEN * (k ? 0.85 : 1);
          const total = segs.reduce((s, q) => s + pathLen(q), 0);
          let budget = total * reveal;
          for (const q of segs) {
            const L = pathLen(q);
            if (budget <= 0) break;
            partialPath(g, q, L <= budget ? 1 : budget / L, o.head && k === 0 ? o.head : 0);
            budget -= L;
          }
          g.restore();
        }
      }
      function hatch(g, clipFn, color, o) {
        o = o || {};
        const alpha = o.alpha === undefined ? 0.3 : o.alpha, step = (o.step || 9) * PEN, ang = o.angle === undefined ? -Math.PI / 4 : o.angle;
        g.save(); clipFn(g); g.clip();
        const bx = o.box || [0, 0, DW, DH];
        const diag = Math.hypot(bx[2] - bx[0], bx[3] - bx[1]);
        const cx = (bx[0] + bx[2]) / 2, cy = (bx[1] + bx[3]) / 2;
        const n = Math.ceil(diag / step);
        const dx = Math.cos(ang), dy = Math.sin(ang);
        const px = -dy, py = dx;
        for (let i = -n; i <= n; i++) {
          const ox = px * i * step, oy = py * i * step;
          const a = [cx + ox - dx * diag / 2, cy + oy - dy * diag / 2];
          const b = [cx + ox + dx * diag / 2, cy + oy + dy * diag / 2];
          stroke(g, [a, b], { color: color, w: o.w || 1.5, alpha: alpha * 0.9, jitter: 1.2, passes: 1, seed: (o.seed || 'h') + i, reveal: o.reveal === undefined ? 1 : o.reveal, taper: false });
        }
        g.restore();
      }
      // ---------------------------------------------------------------- lettering
      function textWidth(g, s, font) {
        g.save(); g.font = font; const w = g.measureText(s).width; g.restore(); return w;
      }
      function sketchText(g, s, x, y, size, o) {
        o = o || {};
        const font = (o.weight === undefined ? 600 : o.weight) + ' ' + size + 'px ' + (o.font || HAND);
        g.save(); g.font = font; g.textBaseline = 'alphabetic';
        const chars = [...s];
        const jit = (o.jitter === undefined ? 1 : o.jitter) * (o.boil ? 0.45 : 1);
        const rndn = rngFor((o.seed || s) + '#' + (o.boil ? boilSeed : ''));
        const ws = chars.map(c => g.measureText(c).width);
        const total = ws.reduce((a, b) => a + b, 0);
        const jitter = jit;
        let cx = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x;

        }
        return { s: SCENES[0], local: 0, u: 0, idx: 0 };
      }
      function applyCam(g, c) {
        g.translate(DW / 2, DH / 2);
        g.scale(c.z, c.z);
        g.rotate(c.rot || 0);
        g.translate(-DW / 2 + c.x, -DH / 2 + c.y);
      }
      function render(tt) {
        const { s, local, u, idx } = sceneAt(tt);
        // paper
        ctx.setTransform(bx, 0, 0, by, 0, 0);
        ctx.clearRect(0, 0, DW, DH);
        ctx.drawImage(paperCv, 0, 0, DW, DH);
        const c = s.cam ? s.cam(u, local) : { x: 0, y: 0, z: 1, rot: 0 };
        // scene
        sctx.setTransform(bx, 0, 0, by, 0, 0);
        sctx.clearRect(0, 0, DW, DH);
        sctx.save(); applyCam(sctx, c); s.draw(sctx, local, u); sctx.restore();
        if (!s.noCaption) caption(sctx, { n: idx + 1, title: s.title, sub: s.sub }, u);
        watermark(sctx, tt);
        ctx.drawImage(sceneCv, 0, 0, DW, DH);
      }

      // ---------------------------------------------------------------- playback
      let t = 0, playing = true, speed = 1, looping = true, soundOn = false, scrubbing = false, started = false;
      let last = performance.now(), prevT = 0, fired = {};
      const overlay = document.getElementById('overlay');
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        if (playing) {
          t += dt * speed;
          if (t >= TOTAL) {
            if (looping) { t = 0; fired = {}; }
            else { t = TOTAL; playing = false; setPlayIcon(); overlay.classList.add('show'); }
          }
        }
        if (t < prevT - 0.05) fired = {};
        prevT = t;
        BOIL = Math.floor(t * 7);
        boilSeed = BOIL;
        render(t);
        syncUI();
        requestAnimationFrame(frame);
      }
      function setPlayIcon() {
        document.getElementById('play').textContent = playing ? '❚❚' : '▶';
      }
      function syncUI() {
        const { idx } = sceneAt(t);
        document.getElementById('scrubfill').style.width = (t / TOTAL * 100) + '%';
        document.getElementById('scrubknob').style.left = (t / TOTAL * 100) + '%';
        document.getElementById('clock').textContent = fmt(t) + ' / ' + fmt(TOTAL);
        document.getElementById('scrubtrack').setAttribute('aria-valuenow', Math.round(t / TOTAL * 100));
      }
      const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

      // ---------------------------------------------------------------- audio (synthesised, off by default)
      let AC = null, master = null, noiseBuf = null;
      function ensureAudio() {
        if (AC) return;
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        AC = new Ctx();
        master = AC.createGain(); master.gain.value = 0.85; master.connect(AC.destination);
        const len = Math.floor(AC.sampleRate * 0.5);
        noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      function noise(dur, vol, freq, q, type) {
        if (!AC) return;
        const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
        const bp = AC.createBiquadFilter(); bp.type = type || 'bandpass'; bp.frequency.value = freq; bp.Q.value = q || 1;
        const g = AC.createGain(); const now = AC.currentTime;
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(vol, now + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        src.connect(bp).connect(g).connect(master); src.start(now); src.stop(now + dur + 0.02);
      }
      function tone(f0, f1, dur, vol, type) {
        if (!AC) return;
        const o = AC.createOscillator(), g = AC.createGain(), now = AC.currentTime;
        o.type = type || 'triangle';
        o.frequency.setValueAtTime(f0, now);
        if (f1) o.frequency.exponentialRampToValueAtTime(f1, now + dur);
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(vol, now + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        o.connect(g).connect(master); o.start(now); o.stop(now + dur + 0.03);
      }
      function sfx(kind, vol) {
        vol = vol || 1;
        if (!AC) return;
        switch (kind) {
          case 'scratch': noise(0.11, 0.05 * vol, 2100 + Math.random() * 900, 0.9); break;
          case 'type': noise(0.02, 0.022 * vol, 3200, 1.6); break;
          case 'pop': tone(520, 880, 0.1, 0.05 * vol, 'triangle'); break;
          case 'click': noise(0.03, 0.07 * vol, 900, 1.2); tone(180, 120, 0.05, 0.05 * vol, 'square'); break;
          case 'thud': tone(150, 58, 0.22, 0.16 * vol, 'sine'); noise(0.16, 0.09 * vol, 320, 0.8, 'lowpass'); break;
          case 'chime': [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, f, 0.5, 0.05 * vol, 'sine'), i * 90)); break;
          case 'whoosh': noise(0.42, 0.05 * vol, 700, 0.7, 'bandpass'); break;
        }
      }
      function cue(kind, key, vol) {
        if (!soundOn || !playing || scrubbing || !AC) return;
        const k = kind + ':' + key;
        if (fired[k] !== undefined && t - fired[k] < 1.2) return;
        fired[k] = t; sfx(kind, vol);
      }

      // ---------------------------------------------------------------- UI
      // give scenes a start time
      let acc = 0; SCENES.forEach(s => { s.start = acc; acc += s.dur; });
      [...document.querySelectorAll('#scrubticks')].forEach(() => { });
      const ticks = document.getElementById('scrubticks');
      SCENES.slice(1).forEach(s => {
        const i = document.createElement('i'); i.style.left = (s.start / TOTAL * 100) + '%'; ticks.appendChild(i);
      });
      function seek(v) {
        if (recording) return;
        t = clamp(v, 0, TOTAL); fired = {}; prevT = t;
        render(t); syncUI();
      }
      function start() { if (!started) { started = true; overlay.classList.remove('show'); } playing = true; setPlayIcon(); }
      document.getElementById('play').addEventListener('click', () => {
        if (recording) return;
        if (t >= TOTAL - 0.02) { t = 0; fired = {}; }
        playing = !playing; if (playing) start(); setPlayIcon();
      });
      document.getElementById('replay').addEventListener('click', () => { if (recording) return; t = 0; fired = {}; start(); });
      document.getElementById('loop').addEventListener('click', e => {
        if (recording) return;
        looping = !looping; e.currentTarget.classList.toggle('on', looping);
      });
      document.getElementById('speed').addEventListener('change', e => { if (recording) return; speed = parseFloat(e.target.value); });
      document.getElementById('sound').addEventListener('click', e => {
        soundOn = !soundOn;
        if (soundOn) { ensureAudio(); if (AC && AC.state === 'suspended') AC.resume(); }
        e.currentTarget.classList.toggle('on', soundOn);
        e.currentTarget.textContent = 'sound: ' + (soundOn ? 'on' : 'off');
        if (soundOn) sfx('chime', 0.6);
      });
      document.getElementById('fs').addEventListener('click', () => {
        const el = document.getElementById('stage');
        if (document.fullscreenElement) document.exitFullscreen();
        else if (el.requestFullscreen) el.requestFullscreen();
      });
      document.getElementById('bigplay').addEventListener('click', () => { start(); });
      // scrubber
      const track = document.getElementById('scrubtrack');
      function seekFromEvent(ev) {
        const r = track.getBoundingClientRect();
        seek((ev.clientX - r.left) / r.width * TOTAL);
      }
      track.addEventListener('pointerdown', e => {
        scrubbing = true; track.setPointerCapture(e.pointerId); seekFromEvent(e);
      });
      track.addEventListener('pointermove', e => { if (scrubbing) seekFromEvent(e); });
      track.addEventListener('pointerup', e => { scrubbing = false; try { track.releasePointerCapture(e.pointerId); } catch (_) { } });
      track.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') { seek(t - 5); e.preventDefault(); }
        if (e.key === 'ArrowRight') { seek(t + 5); e.preventDefault(); }
        if (e.key === ' ') { playing = !playing; if (playing) start(); setPlayIcon(); e.preventDefault(); }
      });
      // keyboard
      window.addEventListener('keydown', e => {
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
        if (recording) { if (e.key === 'Escape') record(); return; }
        if (e.key === 'v' || e.key === 'V') { record(); return; }
        if (e.key === 'p' || e.key === 'P') { savePNG(); return; }
        if (e.key === ' ') { playing = !playing; if (playing) start(); setPlayIcon(); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { seek(t - 5); e.preventDefault(); }
        else if (e.key === 'ArrowRight') { seek(t + 5); e.preventDefault(); }
        else if (e.key === 'r' || e.key === 'R') { t = 0; fired = {}; start(); }
        else if (e.key === 'f' || e.key === 'F') { document.getElementById('fs').click(); }
        else if (e.key === 'm' || e.key === 'M') { document.getElementById('sound').click(); }
        else if (/^[1-9]$/.test(e.key)) { const s = SCENES[+e.key - 1]; if (s) { seek(s.start); start(); } }
      });
      // ---------------------------------------------------------------- export: a frame, or the whole film
      let recording = false, rec = null, recWatch = null, recMime = '', recExt = '';
      const toastEl = document.getElementById('toast');
      let toastTimer = null;
      function toast(msg, ms) {
        toastEl.textContent = msg; toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 2200);
      }
      // render once at a fixed output size without disturbing what's on screen
      function atResolution(w, h, fn) {
        const ow = cv.width, oh = cv.height;
        setRenderSize(w, h);
        render(t);
        fn();
        setRenderSize(ow, oh);
        render(t);
      }
      function savePNG() {
        if (recording) return;
        toast('rendering 1920×1080…', 1200);
        atResolution(1920, 1080, () => {
          cv.toBlob(blob => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'openflowkit-' + fmt(t).replace(':', 'm') + 's.png';
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 4000);
            toast('frame saved', 2000);
          }, 'image/png');
        });
      }
      function pickMime() {
        const tries = [
          ['video/webm;codecs=vp9', 'webm'],
          ['video/webm;codecs=vp8', 'webm'],
          ['video/webm', 'webm'],
          ['video/mp4', 'mp4']
        ];
        if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return null;
        for (const [mime, ext] of tries) if (MediaRecorder.isTypeSupported(mime)) return { mime, ext };
        return null;
      }
      function record() {
        if (recording) { try { rec && rec.stop(); } catch (err) { } return; }
        if (!cv.captureStream || !window.MediaRecorder) {
          toast('this browser cannot record — use “png” instead', 3200);
          return;
        }
        const m = pickMime();
        if (!m) { toast('this browser cannot record — use “png” instead', 3200); return; }
        recMime = m.mime; recExt = m.ext;
        const chunks = [];
        setRenderSize(1920, 1080);
        const stream = cv.captureStream(30);
        try {
          rec = new MediaRecorder(stream, { mimeType: recMime, videoBitsPerSecond: 5_000_000 });
        } catch (err) {
          rec = null; resize(); toast('recording failed to start', 3200); return;
        }
        rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
        rec.onstop = () => {
          clearInterval(recWatch); recWatch = null;
          const blob = new Blob(chunks, { type: recMime });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'openflowkit-launch.' + recExt;
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 8000);
          recording = false; rec = null;
          document.getElementById('bar').classList.remove('busy');
          const btn = document.getElementById('rec');
          btn.classList.remove('rec'); btn.textContent = '⬇ video';
          looping = true; document.getElementById('loop').classList.add('on');
          resize();
          toast('video saved · ' + (blob.size / 1048576).toFixed(1) + ' MB', 3600);
        };
        // roll the film from the top, one pass, at 1×
        t = 0; fired = {}; prevT = 0; speed = 1; looping = false;
        document.getElementById('speed').value = '1';
        document.getElementById('loop').classList.remove('on');
        document.getElementById('bar').classList.add('busy');
        const btn = document.getElementById('rec');
        btn.classList.add('rec'); btn.textContent = '■ stop';
        recording = true; start(); playing = true; setPlayIcon();
        rec.start(1000);
        toast('recording the film at 1920×1080…', 3000);
        recWatch = setInterval(() => {
          if (!recording) return;
          btn.textContent = '■ stop ' + fmt(t);
          if (t >= TOTAL - 0.05) { try { rec.stop(); } catch (err) { } }
        }, 250);
      }
      document.getElementById('png').addEventListener('click', savePNG);
      document.getElementById('rec').addEventListener('click', record);

      // ---------------------------------------------------------------- pointer parallax (end card)
      const parallax = { x: 0, y: 0 };
      document.getElementById('stage').addEventListener('pointermove', e => {
        const r = cv.getBoundingClientRect();
        parallax.x = ((e.clientX - r.left) / r.width - 0.5) * 2;
        parallax.y = ((e.clientY - r.top) / r.height - 0.5) * 2;
      });
      // ---------------------------------------------------------------- boot
      resize();
      if (reduce) { playing = false; started = false; overlay.classList.add('show'); setPlayIcon(); seek(TOTAL * 0.62); }
      else { start(); }
      requestAnimationFrame(now => { last = now; requestAnimationFrame(frame); });
      window.OFK = {
        seek, play: () => { playing = true; start(); setPlayIcon(); }, pause: () => { playing = false; setPlayIcon(); },
        get t() { return t; }, TOTAL, SCENES, savePNG, record
      };
    })();
  </script>
</body>

</html>
