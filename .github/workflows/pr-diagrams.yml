name: PR diagrams

on:
  pull_request:
    paths:
      - '**/*.openflow.json'
      - '**/*.ofk'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-diagrams-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  diagrams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the agent bundle and the MCP CLI
        run: npm run build:agent && npm --prefix mcp-server run build

      - name: Diagram changes
        uses: ./action
        with:
          cli: node mcp-server/dist/cli.js
