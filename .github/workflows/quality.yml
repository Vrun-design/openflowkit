name: Quality Checks

on:
  push:
    branches: [ main, master, v2 ]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI quality suite
        run: npm run test:ci

      - name: MCP server tests (typecheck + suite)
        run: npm --prefix mcp-server run lint && npm --prefix mcp-server run test:run

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # An SVG drawn as an <img> cannot see the page's web fonts, so its labels fall back to
      # system fonts. Inter here makes that fallback the canvas's own face, as on a Mac.
      - name: Install Inter
        run: sudo apt-get install -y fonts-inter

      - name: Run E2E suite (software WebGL; @local specs need a GPU)
        run: npm run e2e:ci

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on: an example that does not compile, a dead internal link, a
      # shipped feature with no page, or a page with no inventory backing.
      - name: Build docs
        run: npm run build --workspace docs-site
